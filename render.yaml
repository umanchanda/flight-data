services:
  - type: web
    name: flight-diary
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
